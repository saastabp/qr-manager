# Python project config for the qr-admin script (cli/).
# A thin client of the QR Manager API: it signs in, calls the API, and saves
# PNGs. All business rules stay on the server, as they will for the Phase II UI.
# This project is not deployed to AWS.

# --- Project metadata and runtime dependencies --------------------------------
[project]
name = "qr-manager-cli"
version = "0.1.0"
description = "qr-admin command-line client for the QR Manager API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.34",     # Cognito sign-in; these calls don't need AWS credentials
    "requests>=2.32",  # Calls the API and downloads PNGs from presigned URLs
]

# --- Development-only tools ---------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8",  # Test runner
    "ruff>=0.6",  # Linter and import sorter
]

# --- uv settings --------------------------------------------------------------
[tool.uv]
# A single script, not a library, so uv doesn't need to build a wheel.
package = false

# --- Test settings ------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]     # Lets tests write "import qr_admin"
testpaths = ["tests"]

# --- Lint settings ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F: errors and bugs. I: import order. UP: modern syntax.
# B: likely bugs. TID: import hygiene.
select = ["E", "F", "I", "UP", "B", "TID"]